				"$(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Sprites.png",
			);
			shellPath = /bin/sh;
			shellScript = (
				"# D72: Tiles.png/Sprites.png are regenerated at build time by the BoloGlyphs",
				"# executable target and are never committed to git. BoloGlyphs is an explicit",
				"# target dependency, so it is always built before this phase runs.",
				"set -e",
				"mkdir -p \"$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH\"",
				"\"$BUILT_PRODUCTS_DIR/BoloGlyphs\" \"$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH\"",
